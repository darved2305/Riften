[project]
name = "riften"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<2.2",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "python-multipart>=0.0.20",
  "python-dotenv>=1.0", "httpx>=0.28,<1", "pypdf>=5,<7",
  "python-docx>=1.1,<2", "beautifulsoup4>=4.12", "psycopg[binary]>=3.2"
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "npm ci --no-audit --no-fund && npm run build && python -m alembic upgrade head"
