<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="One changed clause, all the way through"><title>One changed clause, all the way through</title><defs><marker id="a45a8e7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#45a8e7" stroke-width="1.8"/></marker><marker id="a48ad88" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#48ad88" stroke-width="1.8"/></marker><marker id="a9374c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9374c4" stroke-width="1.8"/></marker></defs><rect x="1" y="1" width="1278" height="688" rx="20" fill="#fcfeff" stroke="#e1e9ef"/><text x="40" y="49" fill="#223346" font-size="25" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">One changed clause, all the way through</text><text x="40" y="77" fill="#68798b" font-size="13" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Eight visible steps. Stored inputs. Reproducible results. No claim that a model interpretation is binding law.</text><rect x="40" y="130" width="270" height="160" rx="16" fill="#edf8ff" stroke="#c7e6f7"/><text x="59" y="160" fill="#45a8e7" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">01</text><text x="59" y="197" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Bring both versions</text><text x="59" y="232" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Original files or an official URL.</text><text x="59" y="256" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Save the text, source and hash.</text><rect x="350" y="130" width="270" height="160" rx="16" fill="#edf8ff" stroke="#c7e6f7"/><text x="369" y="160" fill="#45a8e7" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">02</text><text x="369" y="197" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Extract and match</text><text x="369" y="232" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Keep sections and page references.</text><text x="369" y="256" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Flag unreadable or repeated clauses.</text><rect x="660" y="130" width="270" height="160" rx="16" fill="#edf8ff" stroke="#c7e6f7"/><text x="679" y="160" fill="#45a8e7" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">03</text><text x="679" y="197" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Find the difference</text><text x="679" y="232" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Align clause identifiers and wording.</text><text x="679" y="256" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Use stored embeddings when present.</text><rect x="970" y="130" width="270" height="160" rx="16" fill="#f5f0fc" stroke="#e0d3f1"/><text x="989" y="160" fill="#48ad88" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">04</text><text x="989" y="197" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Ask the aligned model</text><text x="989" y="232" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Send changed passages to Nugen.</text><text x="989" y="256" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Keep its exact request and response.</text><rect x="970" y="415" width="270" height="160" rx="16" fill="#f5f0fc" stroke="#e0d3f1"/><text x="989" y="445" fill="#48ad88" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">05</text><text x="989" y="482" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Check the draft</text><text x="989" y="517" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Validate the schema and quotations.</text><text x="989" y="541" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Flag known source contradictions.</text><rect x="660" y="415" width="270" height="160" rx="16" fill="#effbf5" stroke="#c9eadb"/><text x="679" y="445" fill="#48ad88" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">06</text><text x="679" y="482" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Approve the condition</text><text x="679" y="517" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Review scope, units and boundaries.</text><text x="679" y="541" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A person explicitly approves the rule.</text><rect x="350" y="415" width="270" height="160" rx="16" fill="#effbf5" stroke="#c9eadb"/><text x="369" y="445" fill="#48ad88" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">07</text><text x="369" y="482" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Replay on stored records</text><text x="369" y="517" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Follow verified dependency paths.</text><text x="369" y="541" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Keep unknown and unconnected results.</text><rect x="40" y="415" width="270" height="160" rx="16" fill="#effbf5" stroke="#c9eadb"/><text x="59" y="445" fill="#48ad88" font-size="12" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">08</text><text x="59" y="482" fill="#223346" font-size="17" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Turn impact into work</text><text x="59" y="517" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Create linked tasks and add evidence.</text><text x="59" y="541" fill="#68798b" font-size="11" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Keep decisions and input snapshots.</text><path d="M310 210 H350" fill="none" stroke="#45a8e7" stroke-width="2" stroke-linejoin="round" marker-end="url(#a45a8e7)"/><path d="M620 210 H660" fill="none" stroke="#45a8e7" stroke-width="2" stroke-linejoin="round" marker-end="url(#a45a8e7)"/><path d="M930 210 H970" fill="none" stroke="#45a8e7" stroke-width="2" stroke-linejoin="round" marker-end="url(#a45a8e7)"/><path d="M1105 290 V415" fill="none" stroke="#9374c4" stroke-width="2" stroke-linejoin="round" marker-end="url(#a9374c4)"/><rect x="1034.5" y="341" width="141" height="28" rx="8" fill="#fff" stroke="#e9eef2"/><text x="1105" y="359" fill="#68798b" font-size="12" font-weight="500" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">structured output</text><path d="M970 495 H930" fill="none" stroke="#48ad88" stroke-width="2" stroke-linejoin="round" marker-end="url(#a48ad88)"/><path d="M660 495 H620" fill="none" stroke="#48ad88" stroke-width="2" stroke-linejoin="round" marker-end="url(#a48ad88)"/><path d="M350 495 H310" fill="none" stroke="#48ad88" stroke-width="2" stroke-linejoin="round" marker-end="url(#a48ad88)"/><text x="40" y="638" fill="#68798b" font-size="12" font-weight="400" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The demo uses an authentic RBI annex and clearly labelled synthetic deposits. Current legal applicability still requires review.</text></svg>