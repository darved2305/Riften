name: riften
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riften
      POSTGRES_USER: riften
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riften_local_only}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - riften_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riften -d riften"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  riften_pg:
